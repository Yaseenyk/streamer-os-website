name: AI Blogger

# Autonomous blog pipeline: OpenAI writes a streamer-focused post from
# scripts/topics.txt and commits the resulting .md to main.
#
# SCHEDULE DISABLED 2026-08-08 — do not re-enable.
#
# This ran Mon/Wed/Fri at 10:00 UTC. Combined with the sister pipeline on the
# yaseenkhatib subdomain it produced a corpus that Google classified as scaled
# content abuse: on 2026-07-11 indexation across the domain fell from 127 to 66
# pages in a single day and impressions dropped ~90%. Of the subdomain's ~165
# URLs, 138 sit in "Discovered/Crawled - currently not indexed" — Google reads
# them and declines to keep them.
#
# Every additional generated post re-confirms that classification, so the
# schedule is removed rather than merely lengthened. Manual dispatch is kept
# only so the script can be exercised; publishing its output to the live site
# is not advisable until the existing corpus has been pruned and the domain has
# recovered.
on:
  workflow_dispatch: {} # manual only — the cron schedule is intentionally gone

# Needed so the workflow can push the generated post back to the repo.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-blogger
  cancel-in-progress: false

jobs:
  write-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_writer.py

      # Opens a pull request instead of pushing to main: every generated post gets
      # a human read before it can deploy. Merging the PR is what publishes it.
      # Needs Settings -> Actions -> "Allow GitHub Actions to create and approve
      # pull requests" enabled on the repo.
      - name: Open a pull request with the new post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ai-blogger[bot]"
          git config user.email "ai-blogger[bot]@users.noreply.github.com"
          git add content/blog scripts/topics.txt
          if git diff --cached --quiet; then
            echo "No new content generated — nothing to commit."
            exit 0
          fi
          post=$(git diff --cached --name-only -- content/blog | head -1)
          branch="ai-blogger/$(basename "$post" .md)"
          git switch -c "$branch"
          git commit -m "content(blog): draft $(basename "$post" .md) for review"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Blog draft: $(basename "$post" .md)" \
            --body "Generated by the AI Blogger workflow. Check every streamerOS claim against docs/knowledge-base.md, the links, and that the first 100 words answer the query before merging."
