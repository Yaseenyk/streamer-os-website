name: AI Blogger

# Blog posts on a schedule: twice a week, OpenAI writes one post for the next
# search query in scripts/topics.txt and publishes it straight to main
# (owner's decision, 2026-10-23), which triggers the deploy.
#
# History: until 2026-08-08 this job ran Mon/Wed/Fri and committed straight to
# main. Combined with the sister pipeline on the yaseenkhatib subdomain, Google
# classified the output as scaled content abuse — on 2026-07-11 indexation fell
# from 127 to 66 pages and impressions dropped ~90%. This version differs: two
# runs a week, topics are real search queries chosen for sales, facts come only
# from docs/knowledge-base.md, and scripts/ai_writer.py fails the run (nothing
# published) when a post breaks its checks. Read new posts after they go live
# and fix or remove any that are wrong.
on:
  schedule:
    - cron: "0 9 * * 1,4" # Mondays and Thursdays, 09:00 UTC
  workflow_dispatch: {}

# Needed so the workflow can push the generated post back to the repo.
permissions:
  contents: write

concurrency:
  group: ai-blogger
  cancel-in-progress: false

jobs:
  write-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Topics already waiting in an open draft PR are skipped this run.
      - name: Generate article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_writer.py

      # Publishes straight to main (owner's decision, 2026-10-23). The script
      # refuses to write a post that breaks its checks, so a bad draft fails
      # the run instead of going live. A push made with GITHUB_TOKEN does not
      # fire `on: push`, so the deploy workflow listens for this workflow's
      # completion instead.
      - name: Commit and push the new post to main
        run: |
          git config user.name "ai-blogger[bot]"
          git config user.email "ai-blogger[bot]@users.noreply.github.com"
          git add content/blog scripts/topics.txt
          if git diff --cached --quiet; then
            echo "No new content generated — nothing to commit."
            exit 0
          fi
          post=$(git diff --cached --name-only -- content/blog | head -1)
          git commit -m "content(blog): $(basename "$post" .md)"
          git pull --rebase origin main
          git push origin HEAD:main
