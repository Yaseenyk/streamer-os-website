name: AI Blogger

# Blog drafts on a schedule: twice a week, OpenAI writes one post for the next
# search query in scripts/topics.txt and opens a PULL REQUEST with it.
# Nothing is published until a human reviews and merges the PR.
#
# History, and why the review gate exists: until 2026-08-08 this job ran
# Mon/Wed/Fri and committed straight to main. Combined with the sister pipeline
# on the yaseenkhatib subdomain, Google classified the output as scaled content
# abuse — on 2026-07-11 indexation across the domain fell from 127 to 66 pages
# and impressions dropped ~90%. Re-enabled on 2026-10-23 at the owner's request
# with three changes: two runs a week, topics are real search queries chosen
# for sales (problem-first, mapped to product features), and every post lands
# as a PR draft. Do not switch it back to committing to main.
on:
  schedule:
    - cron: "0 9 * * 1,4" # Mondays and Thursdays, 09:00 UTC — drafts only (PR)
  workflow_dispatch: {}

# Needed so the workflow can push the generated post back to the repo.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-blogger
  cancel-in-progress: false

jobs:
  write-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Topics already waiting in an open draft PR are skipped this run.
      - name: List topics already in open drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr list --state open --limit 50 --json body --jq '.[].body' > "$RUNNER_TEMP/claimed.txt" || true

      - name: Generate article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAIMED_TOPICS_FILE: ${{ runner.temp }}/claimed.txt
        run: python scripts/ai_writer.py

      # Opens a pull request instead of pushing to main: every generated post gets
      # a human read before it can deploy. Merging the PR is what publishes it.
      # Needs Settings -> Actions -> "Allow GitHub Actions to create and approve
      # pull requests" enabled on the repo.
      - name: Open a pull request with the new post
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ai-blogger[bot]"
          git config user.email "ai-blogger[bot]@users.noreply.github.com"
          git add content/blog scripts/topics.txt
          if git diff --cached --quiet; then
            echo "No new content generated — nothing to commit."
            exit 0
          fi
          post=$(git diff --cached --name-only -- content/blog | head -1)
          topic=$(cat .ai-blogger-topic 2>/dev/null || echo "unknown")
          branch="ai-blogger/$(basename "$post" .md)"
          git switch -c "$branch"
          git commit -m "content(blog): draft $(basename "$post" .md) for review"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Blog draft: $(basename "$post" .md)" \
            --body "Topic: $topic

          Generated by the AI Blogger workflow. Before merging, check every streamerOS claim against docs/knowledge-base.md, check the links, and check that the first 100 words answer the query."
