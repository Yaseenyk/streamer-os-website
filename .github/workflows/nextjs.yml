# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # The AI Blogger pushes with GITHUB_TOKEN, which does not fire `on: push`.
  # Chain off its completion so its posts deploy.
  workflow_run:
    workflows: ["AI Blogger"]
    types: [completed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # Skip when the AI Blogger run failed (nothing new to deploy).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # NOTE: do NOT set `static_site_generator: next` here. That option makes
        # the action write its own `next.config.js`, which Next resolves ahead of
        # our `next.config.ts` — silently dropping `pageExtensions` and the MDX
        # plugin, so every `page.mdx` route (/docs, /docs/installation) vanished
        # from the export and 404'd in production while building fine locally.
        # See https://github.com/actions/configure-pages/issues/107.
        # We already declare `output: 'export'` and `images.unoptimized` in
        # next.config.ts, and a custom domain needs no basePath, so the
        # injection bought us nothing.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        env:
          NEXT_PUBLIC_CHAT_API: ${{ vars.NEXT_PUBLIC_CHAT_API }}
        # `npm run build`, not a bare `next build`, so the post-build
        # verify-sitemap guard actually runs in CI — it's the check that would
        # have caught /docs 404-ing in production on the day it broke.
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tell Bing (whose index also feeds ChatGPT search and Copilot) and other
  # IndexNow engines which pages changed, right after they deploy, instead of
  # waiting for a re-crawl. The key is public by design: it is served at
  # /<key>.txt so the engines can confirm we own the host.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE: https://streamerosai.com
      KEY: 2d750fae7f775148b7d2d65e1188cd92
    steps:
      - name: Checkout (full history for the pushed range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit changed URLs to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..HEAD"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then range="HEAD^..HEAD"; fi
          urls=("$SITE/" "$SITE/blog")
          for f in $(git diff --name-only "$range" -- content/blog app); do
            case "$f" in
              content/blog/*.md) urls+=("$SITE/blog/$(basename "$f" .md)") ;;
              app/*/page.tsx|app/*/page.mdx)
                route="${f#app/}"; route="${route%/page.*}"
                case "$route" in *"["*) continue ;; esac
                urls+=("$SITE/$route") ;;
            esac
          done
          mapfile -t urls < <(printf '%s\n' "${urls[@]}" | sort -u)
          printf 'submitting %s urls:\n' "${#urls[@]}"
          printf '  %s\n' "${urls[@]}"
          json=$(printf '"%s",' "${urls[@]}"); json="[${json%,}]"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"streamerosai.com\",\"key\":\"$KEY\",\"keyLocation\":\"$SITE/$KEY.txt\",\"urlList\":$json}" \
            -w "\nHTTP %{http_code}\n" || true
