<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Stylized Node 'S' Mark -->
  <g transform="translate(10, 20)">
    <!-- Main S Path -->
    <path d="M 45 10 L 20 10 C 14.477 10 10 14.477 10 20 L 10 25 C 10 30.523 14.477 35 20 35 L 35 35 C 40.523 35 45 39.477 45 45 L 45 50 C 45 55.523 40.523 60 35 60 L 10 60" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
    <!-- Logic Node Endpoints -->
    <circle cx="45" cy="10" r="5" fill="#22d3ee" />
    <circle cx="10" cy="60" r="5" fill="#a855f7" />
  </g>

  <!-- Typography -->
  <text x="80" y="62" font-family="'Inter', sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
    streamer<tspan fill="url(#brandGrad)">OS</tspan>
  </text>
</svg>
