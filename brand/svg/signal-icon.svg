<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="streamerOS app icon">
  <defs>
    <linearGradient id="icoGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"></stop>
      <stop offset="1" stop-color="#a855f7"></stop>
    </linearGradient>
    <linearGradient id="icoTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1119"></stop>
      <stop offset="1" stop-color="#070a10"></stop>
    </linearGradient>
    <radialGradient id="icoSheen" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"></stop>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="icoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#icoTile)"></rect>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#icoSheen)"></rect>
  <rect x="2.5" y="2.5" width="95" height="95" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"></rect>
  <g transform="translate(50 50) scale(0.62) translate(-50 -50)">
    <g filter="url(#icoGlow)" fill="url(#icoGrad)">
      <rect x="14.25" y="39" width="7.5" height="22" rx="3.75"></rect>
      <rect x="24.92" y="30" width="7.5" height="40" rx="3.75"></rect>
      <rect x="35.58" y="21" width="7.5" height="58" rx="3.75"></rect>
      <rect x="46.25" y="13" width="7.5" height="74" rx="3.75"></rect>
      <rect x="56.92" y="21" width="7.5" height="58" rx="3.75"></rect>
      <rect x="67.58" y="30" width="7.5" height="40" rx="3.75"></rect>
      <rect x="78.25" y="39" width="7.5" height="22" rx="3.75"></rect>
    </g>
    <circle cx="50" cy="13" r="7" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-opacity="0.5"></circle>
    <circle cx="50" cy="13" r="3.4" fill="#67e8f9"></circle>
  </g>
